version: '3.8'

services:
  postgres:
    image: postgres:14
    container_name: postgres
    environment:
      POSTGRES_DB: amicred_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: amicred
    ports:
      - "5433:5432"

  flyway:
    image: flyway/flyway
    container_name: flyway
    depends_on:
      - postgres
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/amicred_db
      FLYWAY_USER: postgres
      FLYWAY_PASSWORD: amicred
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: keycloak
    command: ["start-dev"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/amicred_db
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: amicred
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    volumes:
      - ./keycloak-init.sh:/opt/keycloak/keycloak-init.sh
    entrypoint: ["/bin/bash", "-c", "/opt/keycloak/keycloak-init.sh & /opt/keycloak/bin/kc.sh start-dev"]

  amicred-app:
    build: .
    container_name: amicred-app
    ports:
      - "8080:8082"
    depends_on:
      - postgres
      - flyway
      - keycloak
    environment:
      JDBC_DATABASE_URL: jdbc:postgresql://postgres:5432/amicred_db
      JDBC_DATABASE_USERNAME: postgres
      JDBC_DATABASE_PASSWORD: amicred
      ENV_FILE: docker
      ENV_PATH: /app/env
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: amicred-realm
